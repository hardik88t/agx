[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agx-cli"
version = "0.1.0"
description = "Antigravity CLI & IDE Unified Management Suite"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Hardik", email = "hardik@example.com" }]
keywords = [
    "antigravity",
    "cli",
    "ide",
    "agent",
    "gemini",
    "sync",
    "management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
agx = "agx.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agx"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

